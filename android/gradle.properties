# "Unable to establish loopback connection": o JDK 21 cria Unix domain
# sockets no TEMP e o perfil "C:\Users\Usuário" (acento) quebra o connect.
# Fix na env de usuário JAVA_TOOL_OPTIONS (-Djdk.net.unixdomain.tmpdir),
# que alcança launcher, daemon Gradle e daemon Kotlin. Aqui não funciona:
# o Gradle aplica -D de org.gradle.jvmargs tarde demais no daemon.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
